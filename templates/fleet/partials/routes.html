{% if routes %}
<div class="space-y-2">
    {% for route in routes %}
    <div class="theme-bg-tertiary hover:opacity-80 rounded-lg p-3 border theme-border transition">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-orange-500/20 text-orange-500 px-2 py-1 rounded text-xs font-bold">
                    {{ route.code }}
                </div>
                <div>
                    <h4 class="font-medium theme-text-primary text-sm">{{ route.name }}</h4>
                    <p class="text-xs theme-text-secondary">{{ route.point_count }} stop{{ route.point_count|pluralize }}</p>
                </div>
            </div>
            <div class="text-right">
                <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-green-500/20 text-green-400">
                    Active
                </span>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% else %}
<div class="text-center py-6">
    <svg class="w-10 h-10 theme-text-tertiary mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path>
    </svg>
    <p class="theme-text-secondary text-sm">No active routes</p>
</div>
{% endif %}
