<div class="space-y-3">
    <!-- Database Status -->
    <div class="flex items-center justify-between p-3 theme-bg-tertiary rounded-lg border theme-border">
        <div class="flex items-center space-x-3">
            <div class="w-2 h-2 rounded-full {% if db_status == 'operational' %}bg-green-500{% else %}bg-red-500{% endif %}"></div>
            <span class="text-sm theme-text-primary">Database</span>
        </div>
        <span class="text-xs font-medium {% if db_status == 'operational' %}text-green-400{% else %}text-red-400{% endif %}">
            {{ db_status_text }}
        </span>
    </div>
    
    <!-- API Status -->
    <div class="flex items-center justify-between p-3 theme-bg-tertiary rounded-lg border theme-border">
        <div class="flex items-center space-x-3">
            <div class="w-2 h-2 rounded-full {% if api_status == 'operational' %}bg-green-500{% else %}bg-red-500{% endif %}"></div>
            <span class="text-sm theme-text-primary">API</span>
        </div>
        <span class="text-xs font-medium {% if api_status == 'operational' %}text-green-400{% else %}text-red-400{% endif %}">
            {{ api_status_text }}
        </span>
    </div>
    
    <!-- Data Activity -->
    <div class="flex items-center justify-between p-3 theme-bg-tertiary rounded-lg border theme-border">
        <div class="flex items-center space-x-3">
            <div class="w-2 h-2 rounded-full bg-orange-500"></div>
            <span class="text-sm theme-text-primary">Last Hour</span>
        </div>
        <span class="text-xs font-medium text-orange-400">
            {{ recent_locations_count }} location{{ recent_locations_count|pluralize }}
        </span>
    </div>
    
    <!-- System Uptime -->
    <div class="flex items-center justify-between p-3 theme-bg-tertiary rounded-lg border theme-border">
        <div class="flex items-center space-x-3">
            <div class="w-2 h-2 rounded-full bg-blue-500"></div>
            <span class="text-sm theme-text-primary">System</span>
        </div>
        <span class="text-xs font-medium text-blue-400">
            Operational
        </span>
    </div>
</div>
